services:
  - type: web
    name: smart-warehouse-system
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: WAREHOUSE_DB
        value: backend/warehouse.db
      - key: PYTHON_VERSION
        value: 3.10.12
